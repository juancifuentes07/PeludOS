$kind: http-request
description: Registra una nueva vacuna aplicada a una mascota del usuario autenticado.
url: "{{baseUrl}}/mascotas/:id_mascota/vacunas/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id_mascota
    value: "8533"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "Id Mascota",
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "id_mascota": 2729,
      "nombre_vacuna": "string",
      "fecha_aplicacion": "2010-04-12",
      "id_recordatorio": 9432,
      "fecha_proxima_dosis": null,
      "numero_dosis": 1,
      "lote": "string",
      "veterinario_nombre": null
    }
  $type: |-
    {
      "title": "VacunaCreate",
      "type": "object",
      "properties": {
        "id_mascota": {
          "type": "integer",
          "title": "Id Mascota"
        },
        "id_recordatorio": {
          "title": "Id Recordatorio",
          "anyOf": [
            {
              "type": "integer"
            },
            {
              "type": "null"
            }
          ]
        },
        "nombre_vacuna": {
          "type": "string",
          "title": "Nombre Vacuna"
        },
        "fecha_aplicacion": {
          "type": "string",
          "title": "Fecha Aplicacion",
          "format": "date"
        },
        "fecha_proxima_dosis": {
          "title": "Fecha Proxima Dosis",
          "anyOf": [
            {
              "type": "string",
              "format": "date"
            },
            {
              "type": "null"
            }
          ]
        },
        "numero_dosis": {
          "type": "integer",
          "title": "Numero Dosis"
        },
        "lote": {
          "title": "Lote",
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        },
        "veterinario_nombre": {
          "title": "Veterinario Nombre",
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "id_mascota",
        "nombre_vacuna",
        "fecha_aplicacion"
      ]
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Create New Vacuna.resources/examples
order: 2000
