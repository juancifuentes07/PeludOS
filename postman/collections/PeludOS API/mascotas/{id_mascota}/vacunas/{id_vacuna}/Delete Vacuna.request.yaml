$kind: http-request
description: |-
  Elimina físicamente una vacuna (esta tabla no tiene campo 'activo').
  Devuelve 204 sin body, a diferencia de los demás DELETE del proyecto
  que devuelven el registro desactivado.
url: "{{baseUrl}}/mascotas/:id_mascota/vacunas/:id_vacuna"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id_mascota
    value: "8533"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "Id Mascota",
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: id_vacuna
    value: "6854"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "Id Vacuna",
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: oauth2
  credentials:
    accessTokenUrl: auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Delete Vacuna.resources/examples
order: 3000
