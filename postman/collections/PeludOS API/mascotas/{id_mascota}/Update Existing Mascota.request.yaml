$kind: http-request
description: |-
  Actualiza los datos de una mascota del usuario autenticado
  (actualización parcial).
url: "{{baseUrl}}/mascotas/:id_mascota"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id_mascota
    value: "8533"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "Id Mascota",
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "nombre": "string",
      "especie": null,
      "raza": "string",
      "sexo": "string",
      "fecha_nacimiento": "1996-10-20",
      "peso_kg": null,
      "color_mascota": null,
      "numero_chip": null,
      "foto_url": null,
      "alergias": null,
      "condiciones_medicas": "string",
      "activo": false
    }
  $type: |-
    {
      "title": "MascotaUpdate",
      "type": "object",
      "properties": {
        "nombre": {
          "title": "Nombre",
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        },
        "especie": {
