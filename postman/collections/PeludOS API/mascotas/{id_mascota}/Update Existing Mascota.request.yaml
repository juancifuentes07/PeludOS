            }
          ]
        },
        "sexo": {
          "title": "Sexo",
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        },
        "fecha_nacimiento": {
          "title": "Fecha Nacimiento",
          "anyOf": [
            {
              "type": "string",
              "format": "date"
            },
            {
              "type": "null"
            }
          ]
        },
        "peso_kg": {
          "title": "Peso Kg",
