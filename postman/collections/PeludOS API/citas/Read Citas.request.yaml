$kind: http-request
description: Lista las citas de las mascotas del usuario autenticado.
url: "{{baseUrl}}/citas/"
method: GET
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: oauth2
  credentials:
    accessTokenUrl: auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Read Citas.resources/examples
order: 1000
