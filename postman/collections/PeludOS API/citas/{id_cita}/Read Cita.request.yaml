$kind: http-request
description: Devuelve el detalle de una cita del usuario autenticado (o de cualquiera, si es admin).
url: "{{baseUrl}}/citas/:id_cita"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id_cita
    value: "7218"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "Id Cita",
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: oauth2
  credentials:
    accessTokenUrl: auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Read Cita.resources/examples
order: 1000
