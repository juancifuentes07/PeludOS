$kind: http-request
description: Devuelve la información del usuario autenticado (dueño del token).
url: "{{baseUrl}}/usuarios/me"
method: GET
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: oauth2
  credentials:
    accessTokenUrl: auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Read Current User.resources/examples
order: 1000
