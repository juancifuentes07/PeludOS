$kind: http-request
description: Desactiva (soft delete) al usuario autenticado. No borra el registro físicamente.
url: "{{baseUrl}}/usuarios/me"
method: DELETE
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: oauth2
  credentials:
    accessTokenUrl: auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Deactivate Current User.resources/examples
order: 2000
