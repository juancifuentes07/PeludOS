$kind: http-request
description: Registra un nuevo profesional en una veterinaria. Requiere rol admin.
url: "{{baseUrl}}/veterinarias/:id_veterinaria/profesionales/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id_veterinaria
    value: "1327"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "Id Veterinaria",
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "nombre_completo": "string",
      "especialidad": null,
      "numero_registro_profesional": "string",
      "telefono": null,
      "correo_electronico": null
    }
  $type: |-
    {
      "title": "ProfesionalCreate",
      "type": "object",
      "properties": {
        "nombre_completo": {
          "type": "string",
          "title": "Nombre Completo"
        },
        "especialidad": {
          "title": "Especialidad",
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        },
        "numero_registro_profesional": {
          "title": "Numero Registro Profesional",
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        },
        "telefono": {
          "title": "Telefono",
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        },
        "correo_electronico": {
          "title": "Correo Electronico",
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "nombre_completo"
      ]
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: auth/login
    grant_type: password_credentials
settings: {}
examples: ./.resources/Create New Profesional.resources/examples
order: 2000
